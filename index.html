<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#6b141a">
  <link rel="manifest" href="manifest.json">
  <title>Wadbook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@800&family=Noto+Sans+Gujarati:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=14">
</head>
<body>
  <header>
    <div class="lg2">
      <div class="logo">
        <svg viewBox="0 0 64 64">
          <path d="M32 56V34M27 56c1-6 2-12 2-20M37 56c-1-6-2-12-2-20M22 56c3-4 5-9 6-15M42 56c-3-4-5-9-6-15" stroke="#6b141a" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M18 35c-1 5-2 9-2 13M46 35c1 5 2 9 2 13M23 36c0 4-1 8-1 11M41 36c0 4 1 8 1 11" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
          <path d="M14 34c-5 0-8-4-8-9 0-4 3-7 7-8 1-5 5-9 11-9 3 0 6 1 8 3 2-2 5-3 8-3 6 0 10 4 11 9 4 1 7 4 7 8 0 5-3 9-8 9H14z" fill="url(#wadGrad)"/>
          <defs>
            <linearGradient id="wadGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#f59e0b"/>
              <stop offset="60%" stop-color="#d97706"/>
              <stop offset="100%" stop-color="#6b141a"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <div>
        <div class="wb"><span class="wt">Wadbook</span></div>
        <p>શ્રી બનાસકાંઠા ગુર્જર પ્રજાપતિ સમાજ</p>
      </div>
    </div>
    <div class="hr">
      <span id="sub" hidden></span>
      <button class="ib" onclick="soon()" aria-label="શોધખોળ">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      </button>
      <button id="mb" onclick="menu(1)" aria-label="મેનૂ">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </div>
  </header>

  <main>
    <section id="tv" hidden>
      <div class="wad-bg" id="wadBg" aria-hidden="true"></div>
      <div id="flt"></div>
      <div id="vp"><div id="stage"></div></div>
      <div id="zc">
        <button onclick="zoom(1.25)">+</button>
        <span id="zl"></span>
        <button onclick="zoom(.8)">−</button>
        <button onclick="fit()">⟲</button>
        <button onclick="toggleFull()" title="ફુલ સ્ક્રીન">⛶</button>
      </div>
    </section>
    <section id="pf"></section>
  </main>

  <div id="sh" hidden></div>
  <div id="cropModal" hidden></div>

  <div id="dr" hidden onclick="menu(0)">
    <aside onclick="event.stopPropagation()">
      <div class="dh">
        <div class="dt">
          <span>Wadbook મેનૂ</span>
          <button onclick="menu(0)" aria-label="બંધ કરો">✕</button>
        </div>
        <div id="dp"></div>
      </div>
      <nav id="dl"></nav>
      <footer id="df"></footer>
    </aside>
  </div>

  <div id="ts" hidden>🌿 ટૂંક સમયમાં આવશે</div>

  <nav class="bn">
    <button data-t="tv" onclick="tab('tv')">
      <svg viewBox="0 0 24 24"><path d="M12 22v-9M12 13c-4 0-7-2.5-7-6 0-2.5 2-4.5 4.5-5C10.3 1.3 11.1 1 12 1s1.7.3 2.5 1c2.5.5 4.5 2.5 4.5 5 0 3.5-3 6-7 6z"/><path d="M8 13c-1.5 1.5-2.5 3-2.5 5M16 13c1.5 1.5 2.5 3 2.5 5"/></svg>
      <span>મારો વડ</span>
    </button>
    <button data-t="tul" onclick="D.me?showTulsi(cur||D.me):empty()">
      <svg viewBox="0 0 24 24"><path d="M12 22V10M12 14c-4.5 0-8-2.5-8-6.5 3.5 0 6.5 1.5 8 4.5M12 11c4.5 0 8-2.5 8-6.5-3.5 0-6.5 1.5-8 4.5"/></svg>
      <span>તુલસી ક્યારો</span>
    </button>
    <button data-t="pf" onclick="D.me?show(D.me):empty()">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4.5"/><path d="M4 21c0-4.4 3.6-7.5 8-7.5s8 3.1 8 7.5"/></svg>
      <span>પ્રોફાઇલ</span>
    </button>
  </nav>

  <script src="firebase-config.js"></script>
  <script src="app.js?v=14"></script>
</body>
</html>
